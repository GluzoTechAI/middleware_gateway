{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · Gluzo Integration Gateway</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #b42318; --muted: #6b7280; --line: #d0d7de; }
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  a { color: inherit; }
  form.search { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 12px; margin-bottom: 16px; }
  form.search label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  form.search input, form.search select { padding: 6px; font: inherit; border: 1px solid var(--line); border-radius: 4px; }
  form.search .actions { display: flex; align-items: end; gap: 8px; }
  button { padding: 7px 12px; font: inherit; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  td.wrapcell { white-space: normal; }
  .http-exchange { padding: 6px 0; }
  .http-exchange summary { cursor: pointer; font-weight: 600; }
  .log-data h3 { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .log-data pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 4px; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  .muted { color: var(--muted); }
  .problem { color: var(--bad); margin-bottom: 12px; }
  .badge { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  main { max-width: 1100px; margin: 32px auto; }
  .admin-nav { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 0 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .admin-nav form { margin-left: auto; }
  .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .login-panel { max-width: 380px; margin: 10vh auto; padding: 28px; border: 1px solid var(--line); border-radius: 12px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .login-form input[type="password"] { padding: 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
  .home-card { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; }
  .home-card:hover { border-color: var(--ok); }
  .home-card h2 { margin-top: 0; }
  .home-card p { color: var(--muted); }
</style>
</head>
<body>{{end}}
{{define "nav"}}
<nav class="admin-nav" aria-label="Admin navigation">
  <a href="/admin">Home</a>
  <a href="/admin/logs?platform=easyecom">Events and workflows</a>
  <a href="/admin/reconcile">Stuck runs</a>
  {{if .BrowserAuthenticated}}<form method="post" action="/admin/logout"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><button type="submit">Sign out</button></form>{{end}}
</nav>
{{end}}
{{define "foot"}}
<p class="muted">Times are UTC. Entries are append-only; retries appear as separate lines.</p>
</body>
</html>{{end}}
